services:
  - type: web
    name: sentinel-chain-backend
    env: python
    buildCommand: "echo 'Zero-dependency standard library build'"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: "0.0.0.0"
      - key: SECRET_KEY
        generateValue: true
